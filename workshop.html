<!DOCTYPE html>
<html>
<head>
<title>Workshop Registration Form</title>
</head>
<body>
<h1>Workshop Registration Form</h1>
<h3>Personal Information</h3>
<form>
<label for="name"> First Name</label>
<input type="text"id=" first name" name="First name" required> </br>
<label for="name"> Last Name</label>
<input type="text"id=" last name" name="Last name" required> </br>
<label for="email">EmailAdress</label>
<input type="email"id="emailaddress" name="emailaddress"required> </br>
<h3> Address Information</h3>
<label for="address">Address</label>
<input type="text"id="Address" name="Address"required> </br>
<label for="city">City</label>
<input type="text"id="City" name="City"required> </br>
<label for="state">State</label>
<select id="state" name="State">
<option value="ts">TS</option>
<option value="ap">AP</option>
<option value="up">UP</option>
</select>
<br><br>
<label for="country">Country</label>
<select id="country" name="Country">
<option value="india">INDIA</option>
<option value="china">CHINA</option>
<option value="usa">USA</option>
</select>
<br><br>
<label for="ZIP">ZIP</label>
<input type="text"id="ZIP" name="ZIP"required> </br>
<label for="phoneno">Phone NO</label>
<input type="tel"id="phone no" name="phone no"> </br>

<label for="collegename">College name:</label>
<input type="text"id="collegename" name="collegename"required> </br>
<input type="submit" value="Submit">
</form>
</body>
</html>
